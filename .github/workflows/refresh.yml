name: Refresh course from docs changes

# Runs every night. It checks Docker's docs for changes to the pages this
# course draws on. When a change is material, it drafts an update and opens a
# pull request that asks the SME for a review. GitHub emails the SME.
# On a night with no relevant change, it does nothing else.
#
# You can also run it by hand from the Actions tab. Leave the box empty to
# check for new changes, or paste docker/docs commit IDs to review those.
on:
  schedule:
    # 08:00 UTC: midnight in California in winter, 1:00 AM in summer.
    # GitHub sometimes starts scheduled runs late.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      commits:
        description: "Optional: docker/docs commit IDs to review, oldest first, separated by spaces. Leave empty to check for new changes."
        required: false
        default: ""

# The job may push a branch, open a pull request, and record what it checked.
# It can't merge.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BRANCH: refresh/run-${{ github.run_number }}
      # Who reviews the drafts. Set the repository variable SME_REVIEWER to
      # change it. The default is the repository owner.
      SME: ${{ vars.SME_REVIEWER || github.repository_owner }}
    steps:
      # 1. Get this repository: the lessons, the source map, the prompts.
      - name: Check out the course
        uses: actions/checkout@v4

      # 2. Get the history of Docker's docs, without downloading every file.
      - name: Get Docker's docs history
        run: git clone --filter=blob:none --no-checkout https://github.com/docker/docs.git _upstream

      # 3. Find what to review: the commits given by hand, or every new commit
      #    that touches a watched page since the last check.
      - name: Find new docs changes
        id: find
        env:
          GIVEN: ${{ inputs.commits }}
        run: |
          if [ -n "$GIVEN" ]; then
            echo "commits=$GIVEN" >> "$GITHUB_OUTPUT"
            echo "newest=" >> "$GITHUB_OUTPUT"
            echo "Reviewing the commits given by hand: $GIVEN"
          else
            python3 scripts/find_new_commits.py
          fi

      # 4. Triage each commit and redraft the affected lesson sections.
      - name: Triage and redraft
        id: refresh
        if: steps.find.outputs.commits != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          COMMITS: ${{ steps.find.outputs.commits }}
        run: python3 scripts/refresh.py

      # 5. When a change is material, put the draft on a new branch and open a
      #    pull request that requests the SME's review.
      - name: Open a pull request for SME review
        if: steps.find.outputs.commits != '' && steps.refresh.outputs.material != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs source-map.json refresh-log
          git commit -m "Refresh course from docs changes, run ${{ github.run_number }}"
          git push origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" --title "$(cat _pr-title.txt)" --body-file _pr-body.md
          # Requesting a review makes GitHub email the SME. If the request
          # fails, the pull request still exists and the run still succeeds.
          gh pr edit "$BRANCH" --add-reviewer "$SME" || echo "Couldn't request a review from $SME. The pull request is open without one."
          gh pr edit "$BRANCH" --add-assignee "$SME" || true

      # 6. Record the newest commit checked, so tomorrow's run doesn't draft
      #    the same change again. Runs given commits by hand don't move it.
      - name: Record what was checked
        if: steps.find.outputs.newest != ''
        env:
          NEWEST: ${{ steps.find.outputs.newest }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -f "$BASE"
          git clean -fdq -e _upstream
          python3 - <<'EOF'
          import datetime, json, os
          with open("refresh-state.json", encoding="utf-8") as f:
              state = json.load(f)
          state["last_checked"] = os.environ["NEWEST"]
          state["checked_at"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          with open("refresh-state.json", "w", encoding="utf-8", newline="\n") as f:
              f.write(json.dumps(state, indent=2) + "\n")
          EOF
          git add refresh-state.json
          git commit -m "Record docs changes checked through ${NEWEST:0:10}"
          git push origin "$BASE"
